[defaults]

callback_plugins = ./callback_plugins
stdout_callback = no_skipped
# stdout_callback = minimal

# optionnal :
display_skipped_hosts = False

# Keep group names with hyphens intact (e.g. proxmox-cli, r42.admin-wazuh).
# DO NOT change to "silently", "warn", or "ignore" — those values RENAME
# groups with hyphens to underscores (proxmox-cli -> proxmox_cli), causing
# plays referencing `hosts: proxmox-cli` to match 0 hosts and silently skip
# the entire play. Hit in May 2026: all scenario deploys silently no-op'd
# the cloud-init disk import step. See range42/range42 issue for details.
force_valid_group_names = never
