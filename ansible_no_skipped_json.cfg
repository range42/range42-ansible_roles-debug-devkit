[defaults]

# Suppress deprecation notices on this config, and not only in the repo ansible.cfg.
#
# The devkit wrappers export ANSIBLE_CONFIG pointing at THIS file
# (proxmox__inc.jsons.basic_vm_actions.to.jsons.sh), and ANSIBLE_CONFIG is the
# highest precedence config source, so it fully overrides both the repo ansible.cfg
# and ~/.ansible.cfg where the setting already lives. Without the line here, every
# devkit run prints deprecation notices coming from ansible-core and its collections.
#
# This matters beyond cosmetics : these wrappers exist to emit JSON for jq, with
# stdout_callback = json. The notices go to stderr, so a plain pipe survives, but any
# caller merging 2>&1 would feed jq invalid input.
deprecation_warnings = False

callback_plugins = ./callback_plugins

# stdout_callback = json_no_skipped
stdout_callback = json
# stdout_callback = minimal
display_skipped_hosts = False

# Keep group names with hyphens intact (e.g. proxmox-cli, r42.admin-wazuh).
# DO NOT change to "silently", "warn", or "ignore" — those values RENAME
# groups with hyphens to underscores (proxmox-cli -> proxmox_cli), causing
# plays referencing `hosts: proxmox-cli` to match 0 hosts and silently skip
# the entire play. Hit in May 2026: all scenario deploys silently no-op'd
# the cloud-init disk import step. See range42/range42 issue for details.
force_valid_group_names = never

[callback_json_no_skipped]

json_indent = 2
json_pretty = False # or True pretty // multiline json
